<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de tiempo de filtración para piscinas. Herramienta de Chemical laboratorio (Classco).">
    
    <title>Cálculo del tiempo de filtración</title>

    <!-- Vercel Web Analytics & Speed Insights -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Importmap simulado para Babel */
        .glass-panel {
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-white min-h-screen text-slate-900 font-sans p-4 md:p-8 flex items-center justify-center">

    <div id="root" class="w-full max-w-xl mx-auto"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        // Simulando iconos básicos con SVG directo para evitar dependencias complejas en el embed puro
        const CalculatorIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16.01" y1="10" y2="10"/><line x1="16" x2="16.01" y1="14" y2="14"/><line x1="16" x2="16.01" y1="18" y2="18"/><line x1="8" x2="8.01" y1="10" y2="10"/><line x1="12" x2="12.01" y1="10" y2="10"/><line x1="8" x2="8.01" y1="14" y2="14"/><line x1="12" x2="12.01" y1="14" y2="14"/><line x1="8" x2="8.01" y1="18" y2="18"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>
        );

        const RefreshIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        );

        function App() {
            const [volumen, setVolumen] = useState('');
            const [caudal, setCaudal] = useState('');
            const [resultado, setResultado] = useState(null);
            const [error, setError] = useState('');

            // Cargar datos previos si existen (Persistencia leve)
            useEffect(() => {
                const savedVolumen = localStorage.getItem('pool_volumen');
                const savedCaudal = localStorage.getItem('pool_caudal');
                if (savedVolumen) setVolumen(savedVolumen);
                if (savedCaudal) setCaudal(savedCaudal);
            }, []);

            const calcularFiltracion = (e) => {
                e.preventDefault();
                setError('');
                setResultado(null);

                const vol = parseFloat(volumen);
                const cau = parseFloat(caudal);

                if (isNaN(vol) || isNaN(cau)) {
                    setError('Por favor, ingresa valores numéricos válidos en ambos campos.');
                    return;
                }

                if (vol <= 0 || cau <= 0) {
                    setError('Los valores deben ser mayores a cero.');
                    return;
                }

                const horas = vol / cau;
                
                // Redondear a 1 decimal para mayor claridad
                const horasRedondeadas = Math.round(horas * 10) / 10;
                
                setResultado(horasRedondeadas);

                // Guardar para próxima sesión
                localStorage.setItem('pool_volumen', volumen);
                localStorage.setItem('pool_caudal', caudal);
            };

            const limpiarCampos = () => {
                setVolumen('');
                setCaudal('');
                setResultado(null);
                setError('');
                localStorage.removeItem('pool_volumen');
                localStorage.removeItem('pool_caudal');
            };

            return (
                <div className="w-full flex flex-col gap-6">
                    {/* Header */}
                    <div className="text-center space-y-3 pb-6 border-b border-slate-100">
                        <h1 className="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">
                            Cálculo del tiempo de filtración
                        </h1>
                        <p className="text-slate-500 text-sm md:text-base max-w-lg mx-auto leading-relaxed">
                            En esta aplicación podrás calcular la cantidad horas de filtración al día con el fin de lograr una limpieza óptima del agua y evitar cambios en la turbiedad y color.
                        </p>
                    </div>

                    {/* Main Form Area */}
                    <div className="glass-panel rounded-2xl p-6 md:p-8">
                        <form onSubmit={calcularFiltracion} className="space-y-6">
                            
                            {/* Inputs */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="space-y-2">
                                    <label htmlFor="volumen" className="block text-sm font-semibold text-slate-700">
                                        Volumen de la piscina
                                    </label>
                                    <div className="relative">
                                        <input
                                            type="number"
                                            id="volumen"
                                            value={volumen}
                                            onChange={(e) => setVolumen(e.target.value)}
                                            placeholder="Ej. 50"
                                            step="0.1"
                                            className="w-full pl-4 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-slate-800 font-medium placeholder-slate-400"
                                            required
                                        />
                                        <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium text-sm">
                                            m³
                                        </span>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <label htmlFor="caudal" className="block text-sm font-semibold text-slate-700">
                                        Caudal de la bomba
                                    </label>
                                    <div className="relative">
                                        <input
                                            type="number"
                                            id="caudal"
                                            value={caudal}
                                            onChange={(e) => setCaudal(e.target.value)}
                                            placeholder="Ej. 12.5"
                                            step="0.1"
                                            className="w-full pl-4 pr-16 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-slate-800 font-medium placeholder-slate-400"
                                            required
                                        />
                                        <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium text-sm">
                                            m³/h
                                        </span>
                                    </div>
                                </div>
                            </div>

                            {/* Error Message */}
                            {error && (
                                <div className="p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 text-center">
                                    {error}
                                </div>
                            )}

                            {/* Actions */}
                            <div className="flex flex-col sm:flex-row gap-3 pt-2">
                                <button
                                    type="submit"
                                    className="flex-1 flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 hover:scale-[1.02] active:scale-[0.98] shadow-sm"
                                >
                                    <CalculatorIcon />
                                    <span>Calcular</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={limpiarCampos}
                                    className="flex items-center justify-center gap-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-medium py-3 px-6 rounded-xl transition-all duration-200 hover:border-slate-300"
                                >
                                    <RefreshIcon />
                                    <span>Limpiar</span>
                                </button>
                            </div>
                        </form>

                        {/* Results Area */}
                        <div className={`mt-6 overflow-hidden transition-all duration-500 ease-in-out ${resultado !== null ? 'max-h-40 opacity-100' : 'max-h-0 opacity-0'}`}>
                            <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-5 flex flex-col items-center justify-center text-center">
                                <span className="text-indigo-800 text-sm font-medium mb-1">Tiempo recomendado de filtración:</span>
                                <div className="flex items-baseline gap-2 text-indigo-900">
                                    <span className="text-4xl font-bold tracking-tight">{resultado}</span>
                                    <span className="text-lg font-semibold text-indigo-700">horas/día</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Footer / Copyright */}
                    <div className="text-center pt-8 pb-4">
                        <p className="text-[11px] text-slate-400 leading-tight max-w-sm mx-auto">
                            Propiedad de Chemical laboratorio (Classco, marca registrada) para el entrenamiento "operación y mantenimiento de piscinas".
                        </p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
